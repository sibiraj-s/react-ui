root: true

extends:
  - pegasus
  - pegasus/browser
  - pegasus/node
  - plugin:@pandacss/recommended

overrides:
  - files:
      - '**/*.ts'
      - '**/*.tsx'
    extends:
      - pegasus/typescript
      - pegasus/react
      - plugin:prettier/recommended
    parserOptions:
      project: './tsconfig.json'

  - files:
      - '*.stories.@(ts|tsx|js|jsx|mjs|cjs)'
    extends:
      - plugin:storybook/recommended
      - pegasus/typescript
      - pegasus/react
      - plugin:prettier/recommended
    parserOptions:
      project: './tsconfig.json'

  - files:
      - '.storybook/**'
    rules:
      '@pandacss/file-not-included': off

ignorePatterns:
  - '!.storybook/'
